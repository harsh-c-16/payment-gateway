              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateRequest'
  /v1/carts/{cart_id}/quote:
    post:
      operationId: quote_cart
      parameters:
      - name: X-Namespace
        in: header
        required: true
        schema: *id001
      - name: X-Run-ID
        in: header
        required: true
        schema: *id002
      - name: X-User-ID
        in: header
        required: true
        schema: *id003
      - name: X-Correlation-ID
        in: header
        required: true
        schema: *id004
      - name: X-Request-ID
        in: header
        required: true
        schema: *id005
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '201':
          description: Accepted contract response
          content:
            application/json:
              schema:
                $ref: catalog.yaml#/components/schemas/Quote
        '400':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Common error; never a success-shaped fallback
          content:
