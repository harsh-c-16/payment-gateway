              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
