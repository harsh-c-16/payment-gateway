        schema: *id005
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sku
        in: path
        required: true
        schema:
          type: string
          pattern: ^[!-~]{1,64}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Accepted contract response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSnapshot'
        '400':
          description: Common error; never a success-shaped fallback
          content:
