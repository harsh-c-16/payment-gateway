        '503':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
  /v1/carts/{cart_id}:
    get:
      operationId: get_cart
      parameters:
