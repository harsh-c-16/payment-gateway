                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
