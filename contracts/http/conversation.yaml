openapi: 3.1.0
info:
  title: Conversation API
  version: 1.0.0
  description: P2 contract only. External provider schemas and proposed identity header
    bindings require G0 review. No running service is implied.
servers:
- url: http://conversation:8001
paths:
  /v1/sessions:
    post:
      operationId: create_session
      parameters:
      - name: X-Namespace
        in: header
        required: true
        schema: &id001
          type: string
          minLength: 1
      - name: X-Run-ID
        in: header
        required: true
        schema: &id002
          type: string
          minLength: 1
      - name: X-User-ID
        in: header
        required: true
        schema: &id003
          type: string
          minLength: 1
      - name: X-Correlation-ID
        in: header
        required: true
        schema: &id004
          type: string
          minLength: 1
      - name: X-Request-ID
        in: header
        required: true
        schema: &id005
          type: string
          minLength: 1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '201':
          description: Accepted contract response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Common error; never a success-shaped fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
  /v1/sessions/{session_id}/turns:
    post:
      operationId: submit_turn
      parameters:
      - name: X-Namespace
        in: header
        required: true
