# Generated by python -m services.conversation.shopping_contract
openapi: 3.1.0
info:
  title: ShopTalk browser and contextual conversation API
  version: 1.0.0
  description: Additive shopping experience. Cart, quote and checkout use conversation.yaml.
paths:
  /v1/store/bootstrap:
    get:
      summary: Bootstrap
      operationId: bootstrap_v1_store_bootstrap_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingBootstrap'
  /v1/sessions/{session_id}:
    get:
      summary: Session Snapshot
      operationId: session_snapshot_v1_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/shopping-turns:
    post:
      summary: Shopping Turn
      operationId: shopping_turn_v1_sessions__session_id__shopping_turns_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingTurnRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/store/products:
    get:
      summary: Store Products
      operationId: store_products_v1_store_products_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Q
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Category
      - name: max_price_minor
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1000000000
            minimum: 0
          - type: 'null'
          title: Max Price Minor
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - relevance
          - price_asc
          - price_desc
          type: string
          default: relevance
          title: Sort
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 12
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/store/facets:
    get:
      summary: Store Facets
      operationId: store_facets_v1_store_facets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetDictionary'
  /v1/store/capabilities:
    get:
      summary: Store Capabilities
      operationId: store_capabilities_v1_store_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCapabilities'
  /v1/store/products/{sku}:
    get:
      summary: Store Product
      operationId: store_product_v1_store_products__sku__get
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
          pattern: ^[!-~]{1,64}$
          title: Sku
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/store/orders/{order_id}:
    get:
      summary: Store Order
      operationId: store_order_v1_store_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$
          format: uuid
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
