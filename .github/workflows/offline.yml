name: Windows prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    name: Windows offline (service checks skip)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # GitHub release downloads returned repeated 504s; keep the same uv pin
      # using its published wheels instead of that release-asset endpoint.
      - name: Install pinned uv from PyPI
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all:
          --index-url https://pypi.org/simple --retries 5 --timeout 60 uv==0.10.8
      - run: uv sync --locked
      - name: Shopping and catalogue contracts
        run: |
          uv run --locked python -m services.conversation.shopping_contract --check
          uv run --locked python -m services.catalog.contract --check
      - run: uv run --locked python -m benchmarks.manual.verify_prompt6 --job offline --out artifacts/ci-offline
      - name: Browser controller and checkout controls
        run: node --test tests/conversation/storefront.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-logs-junit
          path: |
            artifacts/ci-offline/*.json
            artifacts/ci-offline/**/*.log
            artifacts/ci-offline/*.xml
            artifacts/projectctl/*/summary.json
          if-no-files-found: warn
