name: P1 through P6 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked python benchmarks/manual/verify_p5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-offline-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
  conversation-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked python benchmarks/manual/verify_p6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-postgres18-test-double-events
          path: artifacts/
          if-no-files-found: warn
