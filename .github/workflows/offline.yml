name: P1 offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked ruff check projectctl tests/projectctl benchmarks/manual/verify_p1.py
      - run: uv run --locked ruff format --check projectctl tests/projectctl benchmarks/manual/verify_p1.py
      - run: uv run --locked python -m projectctl.schemas --check
      - run: uv run --locked python -m pytest tests/projectctl -q --junitxml=artifacts/p1-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-offline-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
