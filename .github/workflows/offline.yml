name: P1 through P6 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked python benchmarks/manual/verify_p5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-offline-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
  conversation-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: p6_ci
          POSTGRES_PASSWORD: p6_ci_only
          POSTGRES_DB: conversation_p6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p6_ci -d conversation_p6"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P6_TEST_DATABASE_URL: postgresql://p6_ci:p6_ci_only@127.0.0.1:5432/conversation_p6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked python benchmarks/manual/verify_p6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-postgres18-test-double-events
          path: artifacts/
          if-no-files-found: warn
